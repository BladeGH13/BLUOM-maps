<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BLUOM Maps</title>

  <!-- Leaflet Core Engine (Rock Solid Vector/Raster Engine) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --apple-blur: blur(25px) saturate(180%);
      --apple-bg: rgba(255, 255, 255, 0.78);
      --apple-card-border: rgba(255, 255, 255, 0.4);
      --apple-shadow: 0 10px 30px rgba(0, 0, 0, 0.12), 0 1px 3px rgba(0, 0, 0, 0.05);
      --apple-blue: #007AFF;
      --apple-text: #1d1d1f;
      --apple-subtext: #86868b;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --apple-bg: rgba(28, 28, 30, 0.78);
        --apple-card-border: rgba(255, 255, 255, 0.12);
        --apple-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        --apple-text: #f5f5f7;
        --apple-subtext: #a1a1a6;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #000; color: var(--apple-text); }

    #map { width: 100vw; height: 100vh; z-index: 1; }

    /* Floating Apple Maps Style Top Search Header */
    .search-container {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      width: calc(100% - 32px);
      max-width: 420px;
    }

    .apple-card {
      background: var(--apple-bg);
      backdrop-filter: var(--apple-blur);
      -webkit-backdrop-filter: var(--apple-blur);
      border: 1px solid var(--apple-card-border);
      border-radius: 20px;
      box-shadow: var(--apple-shadow);
      padding: 10px 14px;
      transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .search-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-icon-svg { width: 18px; height: 18px; fill: var(--apple-subtext); flex-shrink: 0; }

    .search-input {
      border: none;
      background: transparent;
      outline: none;
      color: var(--apple-text);
      font-size: 16px;
      font-weight: 400;
      width: 100%;
    }

    .search-input::placeholder { color: var(--apple-subtext); }

    .brand-badge {
      font-size: 10px;
      font-weight: 700;
      color: var(--apple-blue);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      background: rgba(0, 122, 255, 0.12);
      padding: 4px 8px;
      border-radius: 12px;
      white-space: nowrap;
    }

    /* Floating Auto-complete Search Results */
    .search-results {
      margin-top: 8px;
      display: none;
      max-height: 240px;
      overflow-y: auto;
      border-top: 1px solid var(--apple-card-border);
      padding-top: 6px;
    }

    .result-item {
      padding: 10px 8px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .result-item:hover { background: rgba(0, 122, 255, 0.1); }

    /* Apple Floating Right Control Stack */
    .controls-stack {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-apple {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--apple-bg);
      backdrop-filter: var(--apple-blur);
      -webkit-backdrop-filter: var(--apple-blur);
      border: 1px solid var(--apple-card-border);
      box-shadow: var(--apple-shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease;
    }

    .btn-apple:active { transform: scale(0.90); }
    .btn-apple svg { width: 22px; height: 22px; fill: var(--apple-blue); }

    /* Bottom Directions Banner (Apple Style) */
    .route-banner {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(120%);
      z-index: 1000;
      width: calc(100% - 32px);
      max-width: 420px;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .route-banner.active { transform: translateX(-50%) translateY(0); }

    .route-details {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .route-text h4 { font-size: 17px; font-weight: 600; margin-bottom: 2px; }
    .route-text p { font-size: 13px; color: var(--apple-subtext); }

    .btn-go {
      background: var(--apple-blue);
      color: #fff;
      border: none;
      padding: 8px 18px;
      border-radius: 18px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
    }

    /* Clean Leaflet Customizations */
    .leaflet-control-attribution { display: none !important; }
    .leaflet-tile-pane { filter: contrast(102%) brightness(98%); }
  </style>
</head>
<body>

  <!-- Floating Search Bar Card -->
  <div class="search-container">
    <div class="apple-card">
      <div class="search-row">
        <!-- XML SVG Search Icon -->
        <svg class="search-icon-svg" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search for a place or address" oninput="handleSearchInput()" />
        <span class="brand-badge">BLUOM</span>
      </div>
      <div id="searchResults" class="search-results"></div>
    </div>
  </div>

  <!-- Apple Right Action Control Stack with XML Vector SVGs -->
  <div class="controls-stack">
    <!-- Location SVG Button -->
    <button class="btn-apple" onclick="locateUser()" title="My Location">
      <svg viewBox="0 0 24 24"><path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3c-.46-4.17-3.77-7.48-7.94-7.94V1h-2v2.06C6.83 3.52 3.52 6.83 3.06 11H1v2h2.06c.46 4.17 3.77 7.48 7.94 7.94V23h2v-2.06c4.17-.46 7.48-3.77 7.94-7.94H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
    </button>
    <!-- Map Style Toggle SVG -->
    <button class="btn-apple" onclick="toggleMapStyle()" title="Toggle Map Style">
      <svg viewBox="0 0 24 24"><path d="M15 3l-6 3-6-3v15l6 3 6-3 6 3V6l-6-3zm0 15l-6 3V6l6-3v15z"/></svg>
    </button>
  </div>

  <!-- Bottom Navigation Card -->
  <div id="routeBanner" class="route-banner">
    <div class="apple-card route-details">
      <div class="route-text">
        <h4 id="destinationTitle">Location Found</h4>
        <p id="destinationSubtitle">Ready to calculate optimal route</p>
      </div>
      <button class="btn-go" onclick="startNavigation()">Directions</button>
    </div>
  </div>

  <div id="map"></div>

  <script>
    // Embedded Custom SVG Pin Icons (Apple Maps style pins)
    const customPinSVG = `
      <svg width="32" height="42" viewBox="0 0 32 42" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M16 0C7.163 0 0 7.163 0 16C0 28 16 42 16 42C16 42 32 28 32 16C32 7.163 24.837 0 16 0Z" fill="#007AFF"/>
        <circle cx="16" cy="16" r="6" fill="white"/>
      </svg>`;

    const customPinIcon = L.divIcon({
      html: customPinSVG,
      className: '',
      iconSize: [32, 42],
      iconAnchor: [16, 42],
      popupAnchor: [0, -38]
    });

    // Reliable Apple-like vector style basemaps
    const mapStyles = {
      light: 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
      dark: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
    };

    let currentStyle = 'light';
    let targetCoords = null;
    let activeRoutePolyline = null;
    let activeMarker = null;

    // Initialize Map Centered on Queensland Region
    const map = L.map('map', {
      center: [-26.923, 152.829],
      zoom: 12,
      zoomControl: false
    });

    // Add Base Tile Layer
    let tileLayer = L.tileLayer(mapStyles[currentStyle], {
      maxZoom: 19,
      subdomains: 'abcd'
    }).addTo(map);

    // Toggle Light/Dark Cartography
    function toggleMapStyle() {
      currentStyle = currentStyle === 'light' ? 'dark' : 'light';
      map.removeLayer(tileLayer);
      tileLayer = L.tileLayer(mapStyles[currentStyle], {
        maxZoom: 19,
        subdomains: 'abcd'
      }).addTo(map);
    }

    // Geolocation Support
    function locateUser() {
      map.locate({ setView: true, maxZoom: 15 });
    }

    map.on('locationfound', (e) => {
      L.marker(e.latlng, { icon: customPinIcon }).addTo(map)
        .bindPopup('<b>Your Location</b>').openPopup();
    });

    // Real-Time Search Autocomplete
    let debounceTimer;
    function handleSearchInput() {
      clearTimeout(debounceTimer);
      const query = document.getElementById('searchInput').value;
      const resultsContainer = document.getElementById('searchResults');

      if (query.length < 3) {
        resultsContainer.style.display = 'none';
        return;
      }

      debounceTimer = setTimeout(async () => {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
        const data = await res.json();

        resultsContainer.innerHTML = '';
        if (data.length > 0) {
          resultsContainer.style.display = 'block';
          data.slice(0, 4).forEach(item => {
            const div = document.createElement('div');
            div.className = 'result-item';
            div.innerHTML = `<svg class="search-icon-svg" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg> ${item.display_name}`;
            div.onclick = () => selectLocation(item.lat, item.lon, item.display_name);
            resultsContainer.appendChild(div);
          });
        }
      }, 300);
    }

    // Select Location & Trigger Apple-style FlyTo
    function selectLocation(lat, lon, displayName) {
      document.getElementById('searchResults').style.display = 'none';
      targetCoords = [parseFloat(lat), parseFloat(lon)];

      map.flyTo(targetCoords, 14, { duration: 1.5 });

      if (activeMarker) map.removeLayer(activeMarker);
      activeMarker = L.marker(targetCoords, { icon: customPinIcon }).addTo(map);

      // Populate Route Banner
      const parts = displayName.split(',');
      document.getElementById('destinationTitle').innerText = parts[0];
      document.getElementById('destinationSubtitle').innerText = parts.slice(1, 3).join(',');
      document.getElementById('routeBanner').classList.add('active');
    }

    // Routing Calculation via OSRM Engine
    async function startNavigation() {
      const center = map.getCenter();
      if (!targetCoords) return;

      // Fetch Routing Path
      const routeUrl = `https://router.project-osrm.org/route/v1/driving/${center.lng},${center.lat};${targetCoords[1]},${targetCoords[0]}?overview=full&geometries=geojson`;
      const res = await fetch(routeUrl);
      const data = await res.json();

      if (data.routes && data.routes.length > 0) {
        const coordinates = data.routes[0].geometry.coordinates.map(coord => [coord[1], coord[0]]);
        
        if (activeRoutePolyline) map.removeLayer(activeRoutePolyline);

        // Draw Translucent Blue Navigation Line
        activeRoutePolyline = L.polyline(coordinates, {
          color: '#007AFF',
          weight: 6,
          opacity: 0.8,
          lineCap: 'round'
        }).addTo(map);

        map.fitBounds(activeRoutePolyline.getBounds(), { padding: [50, 50] });
      }
    }
  </script>
</body>
</html>
